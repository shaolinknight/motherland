<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motherland</title>
  <meta name="description" content="Motherland — your personal Vietnamese learning app.">
  <meta name="theme-color" content="#C8102E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Motherland">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <!-- Apply a forced light/dark theme before first paint (the rest of the app is a module and runs later). -->
  <script>try { const t = JSON.parse(localStorage.getItem('motherland.v1'))?.settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* first launch */ }</script>
  <!-- Fetch every module at once instead of discovering them import by import (keep in sync; npm test checks). -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/ankiexport.js">
  <link rel="modulepreload" href="js/course.js">
  <link rel="modulepreload" href="js/exercises.js">
  <link rel="modulepreload" href="js/games.js">
  <link rel="modulepreload" href="js/haptics.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/merge.js">
  <link rel="modulepreload" href="js/placement.js">
  <link rel="modulepreload" href="js/pwa.js">
  <link rel="modulepreload" href="js/screens.js">
  <link rel="modulepreload" href="js/speech.js">
  <link rel="modulepreload" href="js/srs.js">
  <link rel="modulepreload" href="js/stats.js">
  <link rel="modulepreload" href="js/streak.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/vispell.js">
  <link rel="modulepreload" href="js/vitext.js">
  <link rel="modulepreload" href="data/vi-a.js">
  <link rel="modulepreload" href="data/vi-b.js">
  <link rel="modulepreload" href="data/vi-c.js">
  <link rel="modulepreload" href="data/vi-grammar.js">
  <link rel="modulepreload" href="data/vi.js">
</head>
<body>
  <main id="app"></main>
  <nav id="tabs" class="tabs" aria-label="Main"></nav>
  <noscript>Motherland needs JavaScript turned on.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
